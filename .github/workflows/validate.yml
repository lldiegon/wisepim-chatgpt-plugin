name: Validate public plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/package.py check
      - run: python3 scripts/package.py build
      - uses: actions/upload-artifact@v4
        with:
          name: wisepim-chatgpt-plugin
          path: dist/*
